name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Skill Forge
        run: python scripts/skill_forge.py --final
      - name: Public-content audit
        run: python scripts/public_audit.py --path .
      - name: Fresh-clone simulation
        run: python scripts/test_fresh_clone.py
